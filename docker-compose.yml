---
services:
  vrising:
    image: indifferentbroccoli/vrising-server-docker
    platform: linux/amd64
    restart: unless-stopped
    container_name: vrising
    stop_grace_period: 30s
    ports:
      - 27015:27015/udp
      - 27016:27016/udp
    env_file:
      - .env.example
    volumes:
      - ./server-files:/home/steam/server-files
