services:
  vrising:
    build: .
    container_name: vrising
    volumes:
      - .\server:/data/server
      - .\saves:/data/saves             
      - .\config\bepinex:/data/config/bepinex
      - .\config\game:/data/config/game
      - .\plugins:/data/plugins
      - .\backups:/data/backups
    ports:
      - "9876:9876/udp"
      - "9877:9877/udp"
      - "25575:25575/tcp"
    stop_grace_period: 60s
    restart: unless-stopped